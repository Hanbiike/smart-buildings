<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>ov-eco</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #ove-root { position: absolute; inset: 0; font-family: "JetBrains Mono", monospace; }
      .ove-line { position: absolute; left: 150px; background: rgba(10,16,24,0.74); border-radius: 14px; padding: 18px 30px; color: #fff; font-weight: 700; font-size: 42px; white-space: nowrap; }
      .ove-line .acc { color: #e8590c; }
      #ove-l1 { top: 640px; } #ove-l2 { top: 740px; } #ove-l3 { top: 840px; }
      #ove-tag { position: absolute; left: 150px; top: 588px; font-family: Inter, sans-serif; font-size: 32px; color: rgba(255,255,255,0.75); letter-spacing: 0.12em; }
    </style>
  </head>
  <body>
    <div id="ove-root" data-composition-id="ov-eco" data-width="1920" data-height="1080">
      <div id="ove-tag" class="clip" data-start="2" data-duration="26">NIGHT ECO · SIMULATED</div>
      <div id="ove-l1" class="ove-line clip" data-start="3" data-duration="25">eco band widened <span class="acc">±2 K</span></div>
      <div id="ove-l2" class="ove-line clip" data-start="13" data-duration="15">zones asleep <span class="acc">31 / 39</span></div>
      <div id="ove-l3" class="ove-line clip" data-start="23" data-duration="5">boiler <span class="acc">idle</span></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#ove-tag", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 2);
      for (const [id, t] of [["#ove-l1", 3], ["#ove-l2", 13], ["#ove-l3", 23]]) {
        tl.fromTo(id, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, t);
      }
      window.__timelines = window.__timelines || {};
      window.__timelines["ov-eco"] = tl;
    </script>
  </body>
</html>
