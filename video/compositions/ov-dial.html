<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>ov-dial</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #dial-root { position: absolute; inset: 0; font-family: Inter, sans-serif; }
      #dial-in { position: absolute; top: 54px; right: 64px; width: 248px; text-align: center; background: rgba(10,16,24,0.95); border: 2px solid rgba(255,255,255,0.16); border-radius: 26px; padding: 22px 14px 16px; }
      #dial-face { position: relative; width: 208px; height: 208px; margin: 0 auto; border-radius: 50%; background: rgba(10,16,24,0.82); border: 2px solid rgba(255,255,255,0.28); }
      .tick { position: absolute; left: 50%; top: 50%; width: 4px; height: 14px; margin: -7px 0 0 -2px; background: rgba(255,255,255,0.65); border-radius: 2px; }
      #hand-h, #hand-m { position: absolute; left: 50%; bottom: 50%; transform-origin: 50% 100%; border-radius: 4px; }
      #hand-h { width: 9px; height: 56px; margin-left: -4.5px; background: #f2f5f7; }
      #hand-m { width: 5px; height: 82px; margin-left: -2.5px; background: #e8590c; }
      #dial-pin { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: #f2f5f7; }
      #dial-time { position: relative; height: 52px; margin-top: 12px; color: #fff; font-weight: 700; font-size: 42px; font-variant-numeric: tabular-nums; }
      #dial-sub { position: relative; height: 38px; margin-top: 2px; color: rgba(255,255,255,0.88); font-weight: 600; font-size: 28px; letter-spacing: 0.06em; }
      #dial-wx { position: relative; height: 36px; margin-top: 2px; color: #ffd9a0; font-weight: 700; font-size: 28px; letter-spacing: 0.14em; }
      #dial-tag { margin-top: 6px; color: #d7dee5; font-size: 20px; letter-spacing: 0.22em; }
      .stack-it { position: absolute; left: 0; right: 0; top: 0; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="dial-root" data-composition-id="ov-dial" data-width="1920" data-height="1080">
      <div id="dial-in">
        <div id="dial-face">
          <span class="tick" style="transform: rotate(0deg) translateY(-86px);"></span>
          <span class="tick" style="transform: rotate(30deg) translateY(-86px);"></span>

          <span class="tick" style="transform: rotate(240deg) translateY(-86px);"></span>
          <span class="tick" style="transform: rotate(270deg) translateY(-86px);"></span>
          <span class="tick" style="transform: rotate(300deg) translateY(-86px);"></span>
          <span class="tick" style="transform: rotate(330deg) translateY(-86px);"></span>
          <div id="hand-h"></div>
          <div id="hand-m"></div>
          <div id="dial-pin"></div>
        </div>
        <div id="dial-time">
          <span class="stack-it" id="dt-5">05:00</span>

          <span class="stack-it" id="dt-14">14:00</span>
          <span class="stack-it" id="dt-15">15:00</span>
          <span class="stack-it" id="dt-16">16:00</span>
          <span class="stack-it" id="dt-17">17:00</span>

        </div>
        <div id="dial-sub"><span style="color: rgba(255,255,255,0.6);">OUT&nbsp;</span><span style="position: relative; display: inline-block; width: 118px; height: 34px; vertical-align: top;">          <span class="stack-it" id="tp-0">9°C</span>
          <span class="stack-it" id="tp-1">11°C</span>
          <span class="stack-it" id="tp-2">22°C</span>
          <span class="stack-it" id="tp-3">29°C</span>
          <span class="stack-it" id="tp-4">31°C</span>
          <span class="stack-it" id="tp-6">4°C</span>
          <span class="stack-it" id="tp-7">3°C</span></span></div>
        <div id="dial-wx">
          <span class="stack-it" id="wx-0">CLEAR</span>
          <span class="stack-it" id="wx-1">COLD SNAP</span>
          <span class="stack-it" id="wx-2">NIGHT</span>
        </div>
        <div id="dial-tag">SIMULATED DAY</div>
      </div>
    </div>

      tl.to("#hand-h", { rotation: 690.0, duration: 6.6, ease: "none" }, 128.4);
      tl.set("#dt-5", { opacity: 1 }, 0.00);

      tl.set("#dt-22", { opacity: 0 }, 135.00);
      tl.set("#dt-23", { opacity: 1 }, 135.00);
      tl.set("#dt-23", { opacity: 0 }, 135.00);
      tl.set("#tp-0", { opacity: 1 }, 0.0);

      tl.set("#wx-2", { opacity: 0 }, 135.0);
      window.__timelines = window.__timelines || {};

  </body>
